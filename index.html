<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA - Ultimate Chat Experience</title>
    <style>
        :root { 
            --bg-main: #080b1d; 
            --gradient-bg: linear-gradient(135deg, #080b1d, #111b3d, #190d32); 
            --panel-bg: rgba(255,255,255,.06); 
            --border-color: rgba(255,255,255,.1); 
            --primary-gradient: linear-gradient(90deg, #8b5cf6, #06b6d4); 
            --accent-color: #8b5cf6; 
            --text-color: white; 
        }
        body.theme-purple { --bg-main: #13071e; --gradient-bg: linear-gradient(135deg, #13071e, #2a0845, #11021c); --primary-gradient: linear-gradient(90deg, #c084fc, #ec4899); --accent-color: #c084fc; }
        body.theme-cyan { --bg-main: #02151a; --gradient-bg: linear-gradient(135deg, #02151a, #083344, #030712); --primary-gradient: linear-gradient(90deg, #22d3ee, #3b82f6); --accent-color: #22d3ee; }
        body.theme-midnight { --bg-main: #09090b; --gradient-bg: linear-gradient(135deg, #09090b, #18181b, #27272a); --primary-gradient: linear-gradient(90deg, #f43f5e, #fb923c); --accent-color: #f43f5e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; } 
        body, html { width: 100%; height: 100vh; overflow: hidden; background: var(--bg-main); color: var(--text-color); }
        
        /* AUTH PAGE */
        .auth-page { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--gradient-bg); }
        .login-box { width: min(390px, 90%); padding: 38px 30px; border-radius: 28px; text-align: center; background: rgba(255,255,255,.09); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,.18); }
        .brand-icon { width: 62px; height: 62px; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border-radius: 20px; font-size: 28px; background: var(--primary-gradient); animation: pulseGlow 2s infinite alternate; } 
        @keyframes pulseGlow { 0% { transform: scale(1); box-shadow: 0 0 10px rgba(139,92,246,0.5); } 100% { transform: scale(1.08); box-shadow: 0 0 25px rgba(6,182,212,0.8); } }
        .logo { font-size: 38px; font-weight: bold; margin-bottom: 8px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } 
        .subtitle { color: #aab0c5; margin-bottom: 20px; } 
        .input-group { text-align: left; margin-top: 16px; } 
        .input-group label { display: block; margin-bottom: 7px; font-size: 13px; color: #cbd5e1; } 
        input, select { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,.12); outline: none; border-radius: 12px; background: rgba(0,0,0,.18); color: white; } 
        .login-btn, .secondary-btn { border: none; cursor: pointer; font-weight: bold; border-radius: 12px; } 
        .login-btn { width: 100%; padding: 14px; margin-top: 20px; background: var(--primary-gradient); color: white; } 
        .secondary-btn { width: 100%; padding: 12px; margin-top: 10px; background: transparent; color: #a78bfa; border: 1px solid var(--accent-color); } 
        .error { color: #fca5a5; font-size: 13px; margin-top: 12px; }

        /* SPLASH SCREEN */
        #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .splash-logo { font-size: 48px; font-weight: bold; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: bounceIn 1s ease infinite alternate; }
        @keyframes bounceIn { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }

        /* CHAT APP LAYOUT */ 
        #app { display: none; width: 100vw; height: 100vh; padding: 10px; background: var(--gradient-bg); box-sizing: border-box; } 
        .app-container { width: 100%; height: 100%; max-width: 1200px; margin: auto; display: flex; flex-direction: row; overflow: hidden; border-radius: 16px; background: var(--panel-bg); border: 1px solid var(--border-color); backdrop-filter: blur(10px); } 
        
        .sidebar { width: 320px; height: 100%; padding: 15px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; background: rgba(0,0,0,0.2); } 
        .profile-section { display: flex; flex-direction: column; height: 100%; gap: 10px; overflow: hidden; }
        .profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.05); flex-shrink: 0; } 
        .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: var(--primary-gradient); font-size: 20px; border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0; position: relative; overflow: hidden; } 
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .online-dot { width: 9px; height: 9px; background: #22c55e; border-radius: 50%; position: absolute; bottom: 1px; right: 1px; border: 2px solid #111; }
        .profile-info h3 { font-size: 13px; word-break: break-all; } 
        .status { color: #5eead4; font-size: 11px; } 
        
        .users-list-container { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.15); border-radius: 10px; padding: 10px; border: 1px solid var(--border-color); } 
        .users-list-container h4 { font-size: 12px; color: #aab0c5; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; } 
        
        .notif-bell-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; position: relative; }
        .notif-badge { background: #ef4444; color: white; padding: 1px 5px; border-radius: 10px; font-size: 9px; font-weight: bold; margin-left: 4px; }
        
        .user-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); transition: background 0.2s; word-break: break-all; } 
        .user-item:hover, .user-item.active { background: rgba(255,255,255,0.12); } 
        .user-status-indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }
        .is-online { background: #22c55e; }
        .is-offline { background: #64748b; }

        .chat-area { flex: 1; height: 100%; display: flex; flex-direction: column; min-width: 0; background: rgba(0,0,0,0.05); } 
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; } 
        .messages { flex: 1; padding: 15px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; } 
        .message { max-width: 75%; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.1); word-break: break-word; font-size: 14px; position: relative; } 
        .sent { align-self: flex-end; background: var(--primary-gradient); } 
        .sender-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; } 
        .sender { font-size: 11px; color: #aab0c5; } 
        .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 4px; } 
        .tick { font-size: 12px; opacity: 0.8; } 
        .tick.blue { color: #38bdf8; font-weight: bold; }
        .delete-btn { background: none; border: none; color: #fca5a5; font-size: 11px; cursor: pointer; opacity: 0.8; } 
        .typing-indicator { padding: 0 20px 6px; font-size: 11px; color: #a78bfa; font-style: italic; min-height: 18px; flex-shrink: 0; } 
        
        .message-input { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.1); align-items: center; flex-shrink: 0; } 
        .message-input input { flex: 1; min-width: 0; padding: 12px; font-size: 14px; } 
        .attach-btn { background: transparent; border: none; color: #cbd5e1; font-size: 20px; cursor: pointer; padding: 5px; }
        .send-btn { width: 45px; height: 44px; background: var(--accent-color); font-size: 16px; color: white; display: flex; align-items: center; justify-content: center; border: none; border-radius: 12px; cursor: pointer; flex-shrink: 0; } 
        .media-preview { max-width: 220px; border-radius: 8px; margin-top: 6px; display: block; }

        /* SEARCH RESULTS */
        .search-container { display: flex; gap: 6px; margin-bottom: 10px; }
        .search-results-box { max-height: 100px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 6px; padding: 5px; margin-top: 5px; text-align: left; }
        .search-result-item { padding: 5px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .search-result-item:hover { background: rgba(255,255,255,0.1); }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #1e1e2f; padding: 22px; border-radius: 16px; width: 360px; text-align: center; border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; }
        .avatar-preview-box { width: 70px; height: 70px; margin: 0 auto 10px; border-radius: 50%; background: var(--primary-gradient); display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid rgba(255,255,255,0.3); overflow: hidden; }
        .avatar-preview-box img { width: 100%; height: 100%; object-fit: cover; }

        /* NOTIFICATION PANEL LIST */
        .notif-item { padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 6px; font-size: 12px; text-align: left; display: flex; justify-content: space-between; align-items: center; }

        @media (max-width: 768px) {
            #app { padding: 4px; }
            .app-container { flex-direction: column; border-radius: 10px; }
            .sidebar { width: 100%; height: 35%; padding: 10px; border-right: none; border-bottom: 1px solid var(--border-color); }
            .chat-area { width: 100%; height: 65%; }
            .profile-section { height: 100%; }
        }
    </style>
</head>
<body class="theme-purple">

    <!-- SPLASH SCREEN -->
    <div id="splashScreen">
        <div class="splash-logo">💬 NEXORA</div>
        <p style="color: #aab0c5; margin-top: 10px; font-size: 14px;">Connecting to Secure Chat...</p>
    </div>

    <!-- LOGIN PAGE -->
    <div class="auth-page" id="loginPage">
        <div class="login-box">
            <div class="brand-icon">💬</div>
            <div class="logo">NEXORA</div>
            <p class="subtitle">Connect. Chat. Belong.</p>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            <button class="login-btn" onclick="login()">Enter Nexora →</button>
            <button class="secondary-btn" onclick="createAccount()">Create a new account</button>
            <div class="error" id="errorBox"></div>
        </div>
    </div>

    <!-- MAIN CHAT APP -->
    <div id="app">
        <div class="app-container">
            <div class="sidebar">
                <div class="profile-section">
                    <div class="profile" onclick="openAccountSettings()">
                        <div class="avatar" id="userAvatarDisplay">
                            👨‍💼
                            <div class="online-dot"></div>
                        </div>
                        <div class="profile-info">
                            <h3 id="displayName">NEXORA User</h3>
                            <span class="status">● Settings ⚙️</span>
                        </div>
                    </div>
                    <div class="users-list-container">
                        <h4>
                            <span>💬 Chats</span>
                            <button class="notif-bell-btn" onclick="openNotificationsModal()">
                                🔔 Notifications <span id="notifBadge" class="notif-badge" style="display:none;">0</span>
                            </button>
                        </h4>
                        <div id="chatList">
                            <div class="user-item active" onclick="selectChat('global', 'Global Chat')">🌐 Global Chat Room</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header">
                    <div>
                        <h3 id="chatTitle" style="font-size: 15px;">🌐 Global Chat Room</h3>
                        <small id="chatSub">● Real-time group chat</small>
                    </div>
                    <div>
                        <select id="themeSelector" onchange="changeTheme(this.value)" style="padding: 5px 8px; font-size: 11px;">
                            <option value="theme-purple">Purple</option>
                            <option value="theme-cyan">Cyan</option>
                            <option value="theme-midnight">Midnight</option>
                        </select>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
                <div class="typing-indicator" id="typingIndicator"></div>
                <div class="message-input">
                    <label class="attach-btn" title="Send Photo/Video">
                        📎 <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" onclick="event.stopPropagation();" onchange="handleMediaUpload(event)">
                    </label>
                    <input type="text" id="messageText" placeholder="Type a message..." oninput="handleTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ACCOUNT SETTINGS MODAL -->
    <div class="modal-overlay" id="accountSettingsModal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px; color:#fff; font-size: 16px;">⚙️ Account Settings</h3>
            
            <!-- NAME CUSTOMIZATION -->
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: left;">
                <label style="color:#cbd5e1; font-size:12px; display:block; margin-bottom:4px; font-weight:bold;">✏️ Customize Your Name</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="customNameInput" placeholder="Enter display name..." style="padding: 6px; font-size: 12px;">
                    <button onclick="saveCustomName()" style="padding: 6px 10px; background:var(--accent-color); border:none; border-radius:8px; color:white; cursor:pointer; font-size:12px;">Save</button>
                </div>
            </div>

            <!-- PROFILE PHOTO (FACE) UPLOAD -->
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: left;">
                <label style="color:#cbd5e1; font-size:12px; display:block; margin-bottom:6px; font-weight:bold;">📸 Upload Profile Photo (Face)</label>
                <div class="avatar-preview-box" id="modalAvatarPreview">👨‍💼</div>
                <input type="file" id="profileImageInput" accept="image/*" style="width:100%; font-size:11px; margin-top:4px;" onchange="previewProfileImage(event)">
                <button onclick="saveProfilePhoto()" style="width:100%; padding:6px; background:var(--primary-gradient); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:6px; font-size: 11px;">Save Photo</button>
            </div>

            <!-- SEARCH USER EMAIL SECTION -->
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: left;">
                <label style="color:#cbd5e1; font-size:12px; display:block; margin-bottom:4px; font-weight:bold;">🔍 Search Email ID & Request</label>
                <div class="search-container">
                    <input type="email" id="userSearchInput" placeholder="Search user email..." style="padding: 6px; font-size: 11px;">
                    <button onclick="searchUsersByEmail()" style="padding: 6px 10px; background:var(--accent-color); border:none; border-radius:8px; color:white; cursor:pointer; font-size:12px;">🔍</button>
                </div>
                <div class="search-results-box" id="searchResultsBox">Type email to search...</div>
            </div>

            <!-- PRIVACY SETTINGS -->
            <div style="margin-bottom:10px; text-align:left;">
                <label style="color:#cbd5e1; font-size:12px; display:block; margin-bottom:4px;">Account Privacy</label>
                <select id="accountPrivacySelect" style="width:100%; padding:7px; border-radius:6px; background:#111; color:#fff; border:1px solid #444;" onchange="updateAccountPrivacy(this.value)">
                    <option value="public">Public (Direct Chat)</option>
                    <option value="private">Private (Request Required)</option>
                </select>
            </div>

            <!-- FOLLOWERS COUNT & LIST SECTION -->
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: left; max-height: 100px; overflow-y: auto;">
                <label style="color:#cbd5e1; font-size:12px; display:block; margin-bottom:4px; font-weight:bold;" id="followerCountLabel">👥 Followers (0)</label>
                <div id="followersListContainer" style="font-size: 11px; color: #aab0c5;">No followers yet.</div>
            </div>

            <button onclick="logout()" style="width:100%; padding:8px; background:#ef4444; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:4px;">Logout</button>
            <button onclick="closeAccountSettings()" style="width:100%; padding:5px; background:transparent; color:#aaa; border:none; cursor:pointer; margin-top:4px;">Close</button>
        </div>
    </div>

    <!-- NOTIFICATIONS PANEL MODAL -->
    <div class="modal-overlay" id="notificationsModal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px; color:#fff; font-size: 16px;">🔔 Notification Panel</h3>
            <div id="notificationsListContainer" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;">
                <div style="font-size: 12px; color: #aab0c5; padding: 10px;">No new notifications.</div>
            </div>
            <button onclick="closeNotificationsModal()" style="width:100%; padding:8px; background:var(--accent-color); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Close</button>
        </div>
    </div>

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_SWsXIgcBUkWRmL8wYQzQZFwv0WmQe3Y",
            authDomain: "nexora-f593d.firebaseapp.com",
            projectId: "nexora-f593d",
            storageBucket: "nexora-f593d.firebasestorage.app",
            messagingSenderId: "379595835897",
            appId: "1:379595835897:web:6de19f0f3d462a199a1528"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentChatId = "global";
        let currentChatName = "Global Chat";
        let unsubscribeMessages = null;
        let unsubscribeUsers = null;
        let unsubscribeTyping = null;
        let typingTimeout = null;
        let compressedProfileImage = "";
        let notificationsList = [];

        window.login = async function() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorBox = document.getElementById("errorBox");
            errorBox.innerText = "";
            if (!email || !password) return errorBox.innerText = "Please enter email and password.";
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorBox.innerText = "Login failed: " + error.message;
            }
        };

        window.createAccount = async function() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorBox = document.getElementById("errorBox");
            errorBox.innerText = "";
            if (!email || !password) return errorBox.innerText = "Please enter email and password.";
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", res.user.uid), { 
                    email: email,
                    name: "NEXORA User", 
                    privacy: "public", 
                    online: true,
                    avatar: "",
                    followers: [] 
                });
            } catch (error) {
                errorBox.innerText = "Signup failed: " + error.message;
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const splash = document.getElementById("splashScreen");
                splash.style.display = "flex";

                setTimeout(async () => {
                    splash.style.display = "none";
                    document.getElementById("loginPage").style.display = "none";
                    document.getElementById("app").style.display = "flex";
                }, 1000);

                let email = user.email;
                let displayName = "NEXORA User";
                let userAvatar = "";

                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    let data = userSnap.data();
                    if (data.name) displayName = data.name;
                    if (data.avatar) userAvatar = data.avatar;
                    document.getElementById("accountPrivacySelect").value = data.privacy || "public";
                    renderFollowersList(data.followers || []);
                }
                
                document.getElementById("displayName").innerText = displayName;
                document.getElementById("customNameInput").value = displayName;
                
                updateAvatarDisplay(userAvatar);
                await setDoc(doc(db, "users", user.uid), { email: email, online: true }, { merge: true });
                
                listenToActiveUsersAndRequests();
                listenToMessages();
                listenToTypingStatus();
            } else {
                if (auth.currentUser) {
                    await setDoc(doc(db, "users", auth.currentUser.uid), { online: false }, { merge: true });
                }
                document.getElementById("app").style.display = "none";
                document.getElementById("loginPage").style.display = "flex";
                if (unsubscribeMessages) unsubscribeMessages();
                if (unsubscribeUsers) unsubscribeUsers();
                if (unsubscribeTyping) unsubscribeTyping();
            }
        });

        function updateAvatarDisplay(avatarData) {
            const display = document.getElementById("userAvatarDisplay");
            const preview = document.getElementById("modalAvatarPreview");
            if (avatarData) {
                display.innerHTML = `<img src="${avatarData}"><div class="online-dot"></div>`;
                preview.innerHTML = `<img src="${avatarData}">`;
            } else {
                display.innerHTML = `👨‍💼<div class="online-dot"></div>`;
                preview.innerHTML = `👨‍💼`;
            }
        }

        window.saveCustomName = async function() {
            if (!auth.currentUser) return;
            let newName = document.getElementById("customNameInput").value.trim() || "NEXORA User";
            await setDoc(doc(db, "users", auth.currentUser.uid), { name: newName }, { merge: true });
            document.getElementById("displayName").innerText = newName;
            alert("Name updated successfully!");
        };

        window.previewProfileImage = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 150;
                    const MAX_HEIGHT = 150;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }

                to: targetUid,

        // FIXED ACCEPT REQUEST TO PROPERLY UPDATE FOLLOWER ARRAY
        window.acceptRequest = async function(roomId, targetUid, targetName) {
            await updateDoc(doc(db, "chat_requests", roomId), { status: "accepted" });
            
            // Get current user's name
            const myName = document.getElementById("displayName").innerText;
            
            // Add current user to the requester's followers list, OR add requester to current user based on direction
            // Since targetUid sent the request or is being accepted: let's add target user to MY followers, 
            // and add ME to target user's followers so both counts update correctly!
            const myDocRef = doc(db, "users", auth.currentUser.uid);
            const mySnap = await getDoc(myDocRef);
            if (mySnap.exists()) {
                let myFollowers = mySnap.data().followers || [];
                // If target user is accepting or being accepted, let's ensure target user is in my followers if they followed me
                // Actually, whoever requests: if B requests A, and A accepts, B follows A. So A's followers list gets B's name!
                const reqDoc = await getDoc(doc(db, "chat_requests", roomId));
                if (reqDoc.exists()) {
                    let reqData = reqDoc.data();
                    let followerUserId = reqData.from; // The one who sent the request
                    let userToBeFollowedId = reqData.to; // The one who accepted

                    // Fetch the name of the user who sent the request
                    const followerUserSnap = await getDoc(doc(db, "users", followerUserId));
                    if (followerUserSnap.exists()) {
                        let followerName = followerUserSnap.data().name || "NEXORA User";
                        const followedUserDocRef = doc(db, "users", userToBeFollowedId);
                        const followedSnap = await getDoc(followedUserDocRef);
                        if (followedSnap.exists()) {
                            let existingFollowers = followedSnap.data().followers || [];
                            if (!existingFollowers.includes(followerName)) {
                                existingFollowers.push(followerName);
                                await updateDoc(followedUserDocRef, { followers: existingFollowers });
                            }
                        }
                    }
                }
            }

            alert("Request accepted! Follower increased successfully.");

                        message.innerHTML = `

                                ${isMine ? `<button class="delete-btn" onclick="deleteMessage('${messageId}')">Delete</button>` : ''}
                            </div>

                            ${mediaHTML}
                            ${isMine ? `<div class="msg-footer"><span class="tick ${data.status === 'read' ? 'blue' : ''}">${data.status === 'read' ? '✓✓' : '✓'}</span></div>` : ''}

                        messagesBox.appendChild(message);

                            await updateDoc(doc(db, "messages", messageId), { status: 'read' });

                        if (!isInitialLoad && !isMine) {
                            notificationsList.unshift({

                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });

                            updateNotificationsUI();
                        }
                    }
                });

                messagesBox.scrollTop = messagesBox.scrollHeight;
            });

        function updateNotificationsUI() {

                badge.style.display = "none";

            }
        }

                await setDoc(doc(db, "users", auth.currentUser.uid), { online: false }, { merge: true });
            }
            await signOut(auth);
        };

                    const MAX_HEIGHT = 150;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                        const reqRef = doc(db, "chat_requests", roomId);
                        const reqSnap = await getDoc(reqRef);
                        
                        let onlineIndicator = `<span class="user-status-indicator ${userData.online ? 'is-online' : 'is-offline'}"></span>`;
                        let userAvatarIcon = userData.avatar ? `<img src="${userData.avatar}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;">` : '👤';
                        let displayName = userData.name || "NEXORA User";

                        let showInSidebar = false;
                        let actionHTML = "";

                        // Public account-ah iruntha sidebar-la kaattalam
                        if (userData.privacy !== "private") {
                            showInSidebar = true;
                        } 
                        // Private account-ah iruntha request accept aanathum illa ungalukku pending request vantha mattum kaattum
                        else if (reqSnap.exists()) {
                            let reqData = reqSnap.data();
                            if (reqData.status === "accepted") {
                                showInSidebar = true;
                            } else if (reqData.status === "pending" && reqData.to === auth.currentUser.uid) {
                                showInSidebar = true;
                                displayName += " (Accept)";
                            }
                        }

                        if (showInSidebar) {
                            const item = document.createElement("div");
                            item.className = `user-item ${currentChatId === userId ? 'active' : ''}`;

                            if (userData.privacy === "private" && reqSnap.exists() && reqSnap.data().status === "pending" && reqSnap.data().to === auth.currentUser.uid) {
                                item.onclick = () => acceptRequest(roomId, userId, userData.name || "NEXORA User");
                            } else {
                                item.onclick = () => selectChat(userId, displayName.replace(" (Accept)", ""));
                                if (userData.privacy === "private" && reqSnap.exists() && reqSnap.data().status === "pending" && reqSnap.data().from === auth.currentUser.uid) {
                                    actionHTML = `<button onclick="event.stopPropagation(); removeRequest('${roomId}')" style="background:#ef4444; border:none; color:white; padding:2px 6px; border-radius:4px; font-size:10px; cursor:pointer;">Remove</button>`;
                                    displayName += " (Requested)";
                                }
                            }

                            let statusText = `<div>${onlineIndicator}${userAvatarIcon}${displayName}</div>${actionHTML}`;
                            item.innerHTML = statusText;
                            chatList.appendChild(item);
                        }
                    }
                });
            });
        }

        window.sendChatRequest = async function(targetUid) {
            let roomId = [auth.currentUser.uid, targetUid].sort().join('_');
            await setDoc(doc(db, "chat_requests", roomId), {
                from: auth.currentUser.uid,
                to: targetUid,
                status: "pending"
            });
            alert("Follow request sent successfully!");
        };

        window.removeRequest = async function(roomId) {
            if (confirm("Do you want to remove/cancel this request?")) {
                await deleteDoc(doc(db, "chat_requests", roomId));
                alert("Request removed successfully.");
            }
        };

        window.acceptRequest = async function(roomId, targetUid, targetName) {
            await updateDoc(doc(db, "chat_requests", roomId), { status: "accepted" });
            
            const reqDoc = await getDoc(doc(db, "chat_requests", roomId));
            if (reqDoc.exists()) {
                let reqData = reqDoc.data();
                let followerUserId = reqData.from;
                let userToBeFollowedId = reqData.to;

                const followerUserSnap = await getDoc(doc(db, "users", followerUserId));
                if (followerUserSnap.exists()) {
                    let followerName = followerUserSnap.data().name || "NEXORA User";
                    const followedUserDocRef = doc(db, "users", userToBeFollowedId);
                    const followedSnap = await getDoc(followedUserDocRef);
                    if (followedSnap.exists()) {
                        let existingFollowers = followedSnap.data().followers || [];
                        if (!existingFollowers.includes(followerName)) {
                            existingFollowers.push(followerName);
                            await updateDoc(followedUserDocRef, { followers: existingFollowers });
                        }
                    }
                }
            }

            alert("Request accepted! Follower increased successfully.");
            selectChat(targetUid, targetName);
        };

        window.selectChat = function(chatId, chatName) {
            currentChatId = chatId;
            currentChatName = chatName;
            document.getElementById("chatTitle").innerText = chatId === 'global' ? "🌐 Global Chat Room" : `💬 Private Chat with ${chatName}`;
            document.getElementById("chatSub").innerText = chatId === 'global' ? "● Real-time group chat" : "● Direct messaging";
            listenToMessages();
            listenToTypingStatus();
        };

        window.handleTyping = async function() {
            if (!auth.currentUser) return;
            const typingRef = doc(db, "typing", currentChatId + "_" + auth.currentUser.uid);
            await setDoc(typingRef, { isTyping: true, user: document.getElementById("displayName").innerText }, { merge: true });

            if (typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(async () => {
                await setDoc(typingRef, { isTyping: false }, { merge: true });
            }, 2000);
        };

        function listenToTypingStatus() {
            const indicator = document.getElementById("typingIndicator");
            indicator.innerText = "";
            if (unsubscribeTyping) unsubscribeTyping();

            const typingRef = collection(db, "typing");
            unsubscribeTyping = onSnapshot(typingRef, (snapshot) => {
                let typingText = "";
                snapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    if (docSnap.id.startsWith(currentChatId) && data.isTyping && !docSnap.id.includes(auth.currentUser.uid)) {
                        typingText = `${data.user} is typing... ✍️`;
                    }
                });
                indicator.innerText = typingText;
            });
        }

        window.sendMessage = async function(mediaUrl = "", mediaType = "") {
            const input = document.getElementById("messageText");
            const text = input.value.trim();
            if ((!text && !mediaUrl) || !auth.currentUser) return;

            let roomId = currentChatId === 'global' ? 'global' : [auth.currentUser.uid, currentChatId].sort().join('_');
            await addDoc(collection(db, "messages"), {
                text: text,
                mediaUrl: mediaUrl,
                mediaType: mediaType,
                senderId: auth.currentUser.uid,
                senderName: document.getElementById("displayName").innerText,
                chatRoom: roomId,
                status: 'sent',
                createdAt: serverTimestamp()
            });
            input.value = "";
        };

        window.handleMediaUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                const isVideo = file.type.startsWith("video");
                sendMessage(base64Data, isVideo ? "video" : "image");
            };
            reader.readAsDataURL(file);
        };

        function listenToMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            let targetRoom = currentChatId === 'global' ? 'global' : [auth.currentUser.uid, currentChatId].sort().join('_');
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            
            let isInitialLoad = true;
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const messagesBox = document.getElementById("messages");
                messagesBox.innerHTML = "";
                
                snapshot.forEach(async (docSnap) => {
                    const data = docSnap.data();
                    if (data.chatRoom === targetRoom) {
                        const messageId = docSnap.id;
                        const message = document.createElement("div");
                        const isMine = data.senderId === auth.currentUser.uid;
                        message.className = isMine ? "message sent" : "message";
                        
                        let mediaHTML = "";
                        if (data.mediaUrl) {
                            if (data.mediaType === "video") {
                                mediaHTML = `<video src="${data.mediaUrl}" controls class="media-preview"></video>`;
                            } else {
                                mediaHTML = `<img src="${data.mediaUrl}" class="media-preview">`;
                            }
                        }

                        message.innerHTML = `
                            <div class="sender-row">
                                <span class="sender">${isMine ? "You" : data.senderName}</span>
                                ${isMine ? `<button class="delete-btn" onclick="deleteMessage('${messageId}')">Delete</button>` : ''}
                            </div>
                            <div>${data.text || ""}</div>
                            ${mediaHTML}
                            ${isMine ? `<div class="msg-footer"><span class="tick ${data.status === 'read' ? 'blue' : ''}">${data.status === 'read' ? '✓✓' : '✓'}</span></div>` : ''}
                        `;

                        messagesBox.appendChild(message);

                        if (!isMine && data.status !== 'read') {
                            await updateDoc(doc(db, "messages", messageId), { status: 'read' });
                        }

                        if (!isInitialLoad && !isMine) {
                            notificationsList.unshift({
                                sender: data.senderName,
                                text: data.text || "Sent an attachment",
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });

                            updateNotificationsUI();
                        }
                    }
                });
                isInitialLoad = false;
                messagesBox.scrollTop = messagesBox.scrollHeight;
            });
        }

        function updateNotificationsUI() {
            const badge = document.getElementById("notifBadge");
            const container = document.getElementById("notificationsListContainer");

            if (notificationsList.length > 0) {
                badge.style.display = "inline-block";
                badge.innerText = notificationsList.length;

                container.innerHTML = notificationsList.map(n => `
                    <div class="notif-item">
                        <div>
                            <strong>${n.sender}</strong>: ${n.text}
                        </div>
                        <span style="font-size:10px; color:#aaa;">${n.time}</span>
                    </div>
                `).join("");
            } else {
                badge.style.display = "none";
                container.innerHTML = `<div style="font-size: 12px; color: #aab0c5; padding: 10px;">No new notifications.</div>`;
            }
        }

        window.openNotificationsModal = function() {
            document.getElementById("notificationsModal").style.display = "flex";
        };

        window.closeNotificationsModal = function() {
            document.getElementById("notificationsModal").style.display = "none";
            notificationsList = [];
            updateNotificationsUI();
        };

        window.deleteMessage = async function(messageId) {
            if (confirm("Delete this message?")) {
                await deleteDoc(doc(db, "messages", messageId));
            }
        };

        window.openAccountSettings = () => document.getElementById("accountSettingsModal").style.display = "flex";
        window.closeAccountSettings = () => document.getElementById("accountSettingsModal").style.display = "none";

        window.updateAccountPrivacy = async function(privacyState) {
            if (!auth.currentUser) return;
            await setDoc(doc(db, "users", auth.currentUser.uid), { privacy: privacyState }, { merge: true });
            alert(`Privacy updated to ${privacyState}`);
        };

        window.changeTheme = (themeName) => {
            document.body.className = themeName;
            localStorage.setItem("nexora_theme", themeName);
        };

        window.logout = async () => {
            if (auth.currentUser) {
                await setDoc(doc(db, "users", auth.currentUser.uid), { online: false }, { merge: true });
            }
            await signOut(auth);
        };
    </script>
